<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 850" width="960" height="850" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
<title id="t">How a mesh study becomes checkable evidence in UofA</title>
<desc id="d">A mesh table and the SimEval calcverif tool sit outside the package. UofA hashes the table, runs calcverif unmodified and records what it returned. The record is signed into the UofA package as the measured evidence for the Discretization error factor. Three things can then fire: the signature check when a recorded value is changed, a not-run status when the mesh table is changed after sealing, and the W-CV rules, off by default, when the record does not back the reported claim. On the vena cava case no rule fires.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker>
<marker id="a_acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d5fa6"/></marker>
<marker id="a_fire" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9a4a12"/></marker>
</defs>
<rect x="0.8" y="0.8" width="958.4" height="848.4" rx="8" fill="#ffffff" stroke="#dddddd" stroke-width="1"/>
<rect x="30" y="36" width="420" height="78" rx="10" fill="#f3f3f3" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 5"/>
<text x="240" y="68" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#333333">Mesh table</text>
<text x="240" y="92" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#333333">vena cava case, 8 mesh levels</text>
<rect x="510" y="36" width="420" height="78" rx="10" fill="#f3f3f3" stroke="#444444" stroke-width="1.6" stroke-dasharray="7 5"/>
<text x="720" y="68" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#333333">SimEval calcverif</text>
<text x="720" y="92" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#333333">FDA tool, run unmodified</text>
<polyline points="240,114 240,146 720,146 720,114" fill="none" stroke="#444444" stroke-width="1.6"/>
<polyline points="480,146 480,196" fill="none" stroke="#1d5fa6" stroke-width="1.6" marker-end="url(#a_acc)"/>
<circle cx="503" cy="171" r="11" fill="#1d5fa6"/>
<text x="503" y="175.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">1</text>
<text x="522" y="176" font-family="Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="normal" text-anchor="start" fill="#333333">uofa evidence seal --mesh-study</text>
<rect x="170" y="198" width="620" height="84" rx="10" fill="#e8f1fb" stroke="#1d5fa6" stroke-width="2"/>
<text x="480" y="231" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#333333">UofA runs calcverif</text>
<text x="480" y="257" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#333333">hashes the table, runs the tool unmodified, records what it returned</text>
<rect x="30" y="366" width="900" height="196" rx="14" fill="#fafafa" stroke="#444444" stroke-width="2"/>
<text x="52" y="395" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#333333">Signed UofA package</text>
<polyline points="480,282 480,330 715,330 715,420" fill="none" stroke="#1d5fa6" stroke-width="1.6" marker-end="url(#a_acc)"/>
<circle cx="503" cy="307" r="11" fill="#1d5fa6"/>
<text x="503" y="311.5" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">2</text>
<text x="522" y="312" font-family="Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="normal" text-anchor="start" fill="#333333">uofa import --sign</text>
<rect x="60" y="440" width="330" height="84" rx="10" fill="#f3f3f3" stroke="#444444" stroke-width="1.6"/>
<text x="225" y="475" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#333333">Credibility factor</text>
<text x="225" y="499" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#333333">Discretization error</text>
<rect x="530" y="422" width="370" height="118" rx="10" fill="#e8f1fb" stroke="#1d5fa6" stroke-width="2"/>
<text x="715" y="452" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#333333">Calculation verification record</text>
<text x="715" y="478" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle" fill="#333333">observed order 3.011, safety factor 3</text>
<text x="715" y="499" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13.5" font-weight="normal" text-anchor="middle" fill="#333333">index 0.0012 relative</text>
<text x="715" y="522" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#555555">plus the table hash and the tool hash</text>
<polyline points="530,482 392,482" fill="none" stroke="#1d5fa6" stroke-width="1.6" marker-end="url(#a_acc)"/>
<text x="461" y="472" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#555555">measured evidence for</text>
<polyline points="480,562 480,606" fill="none" stroke="#9a4a12" stroke-width="1.6" marker-end="url(#a_fire)"/>
<rect x="30" y="608" width="900" height="190" rx="10" fill="#fdf4ea" stroke="#9a4a12" stroke-width="1.6"/>
<text x="52" y="637" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#333333">What fires, and when</text>
<text x="52" y="670" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#333333">A recorded value is changed after signing</text>
<text x="470" y="670" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#333333">uofa verify fails</text>
<text x="908" y="670" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#9a4a12">always on</text>
<line x1="52" y1="682" x2="908" y2="682" stroke="#9a4a12" stroke-width="0.8" opacity="0.35"/>
<text x="52" y="704" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#333333">The mesh table is changed after sealing</text>
<text x="470" y="704" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#333333">study is marked not run</text>
<text x="908" y="704" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#9a4a12">always on</text>
<line x1="52" y1="716" x2="908" y2="716" stroke="#9a4a12" stroke-width="0.8" opacity="0.35"/>
<text x="52" y="738" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#333333">The record does not back the reported claim</text>
<text x="470" y="738" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="14" font-weight="bold" text-anchor="start" fill="#333333">a W-CV rule fires</text>
<text x="908" y="738" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13" font-weight="normal" text-anchor="end" fill="#9a4a12">off by default</text>
<text x="52" y="782" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#555555" font-style="italic">Vena cava case: an edited value trips the first two. No rule fires on it.</text>
<text x="30" y="828" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#555555">Dashed boxes are outside the package. Blue is what this step adds. Numbers are from SimEval's own vena cava example.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
